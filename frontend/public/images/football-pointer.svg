  <circle cx="18" cy="18" r="13" fill="#F7F7F2" stroke="#D46726" stroke-width="2"/>
  <!-- Center Pentagon -->
  <polygon points="18,13 22,16 20.5,21 15.5,21 14,16" fill="#D46726"/>
  <!-- Top patch lines -->
