  <polygon points="13.5,19 11,24 16,28 21,24 18.5,19" fill="none" stroke="#1A1A1A" stroke-width="1.2"/>
  <polygon points="18.5,19 20,14 26,15 27,21 21,24" fill="none" stroke="#1A1A1A" stroke-width="1.2"/>
  <!-- Side patches fill -->
